plugins {
    id 'com.android.application'
}

android {
    // Gradle 8+ এ namespace দেওয়া বাধ্যতামূলক (applicationId এর সাথে ম্যাচ রেখে)
    namespace 'com.example.project'
    
    // আধুনিক SDK 34 এ আপগ্রেড করা হলো (Android 14)
    compileSdk 34

    defaultConfig {
        applicationId "com.example.project"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 📦 অ্যাপের সাইজ ছোট করার জন্য আর্কিটেকচার স্প্লিট লজিক (ঠিক রাখা হয়েছে)
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    buildTypes {
        release {
            // 🛡️ ব্যাকব্লেজ বি২ ক্লাউড এসডিকে এবং নেটওয়ার্কিং ক্র্যাশ বন্ধ করার জন্য এগুলো false করা হলো
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // আধুনিক ও স্ট্যাবল ভার্সনে ডিপেন্ডেন্সিগুলো আপডেট করা হয়েছে
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    
    // আপনার ব্যাকব্লেজ বি২ ক্লাউড এসডিকে
    implementation 'com.backblaze.b2:b2-sdk-core:3.1.0'
    implementation 'com.backblaze.b2:b2-sdk-okhttp:3.1.0'
}
