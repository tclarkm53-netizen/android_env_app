# Project-wide Gradle settings.

# ১. 🚀 JVM মেমরি অপ্টিমাইজেশন (জাভা ১৭ এবং গ্রেডল ৮+ এর জন্য ১.৫ জিবি থেকে বাড়িয়ে ৩ জিবি করা হলো)
# এতে গিটহাব অ্যাকশনসে বিল্ড অনেক ফাস্ট হবে এবং আউট অফ মেমরি (OOM) ক্র্যাশ হবে না।
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# ২. ⚡ প্যারালাল বিল্ড অন (মাল্টিপল টাস্ক একসাথে রান করার জন্য)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# ৩. 🧱 অ্যান্ড্রয়েড এক্স সাপোর্ট (Modern Android Architecture)
android.useAndroidX=true

# ৪. ⚠️ জেটিফায়ার কনফিগারেশন (Gradle 8.0+ এর জন্য গুরুত্বপূর্ণ)
# যেহেতু আপনার ডিপেন্ডেন্সিতে ব্যাকব্লেজ বি২ (b2-sdk) সহ আধুনিক লাইব্রেরি আছে, জেটিফায়ারকে ফলস রাখা ভালো।
# যদি বিল্ডে ওল্ড সাপোর্ট লাইব্রেরির কোনো এরর আসে, তবেই কেবল এটাকে true করবেন।
android.enableJetifier=false

# ৫. 🛑 নন-ট্রানজিটিভ আর-ক্লাস অন (বিল্ড সাইজ আরও ছোট এবং ফাস্ট করার জন্য)
android.nonTransitiveRClass=true